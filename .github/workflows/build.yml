name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: go mod tidy

      - name: Build Windows amd64
        run: |
          go build -ldflags="-s -w -H windowsgui" -o adb-phone-controller.exe .
        env:
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-phone-controller-windows-amd64
          path: adb-phone-controller.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: adb-phone-controller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install system deps for Fyne
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Install dependencies
        run: go mod tidy

      - name: Build Linux amd64
        run: go build -ldflags="-s -w" -o adb-phone-controller .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-phone-controller-linux-amd64
          path: adb-phone-controller
