name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install MinGW (for CGO / Fyne)
        run: choco install mingw -y

      - name: Add MinGW to PATH
        run: echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: go mod tidy
        env:
          CGO_ENABLED: 1

      - name: Build Windows amd64
        run: go build -ldflags="-s -w -H windowsgui" -o adb-phone-controller.exe .
        env:
          CGO_ENABLED: 1
          CC: gcc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-phone-controller-windows-amd64
          path: adb-phone-controller.exe

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: adb-phone-controller.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install system deps for Fyne
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Install dependencies
        run: go mod tidy

      - name: Build Linux amd64
        run: go build -ldflags="-s -w" -o adb-phone-controller .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-phone-controller-linux-amd64
          path: adb-phone-controller

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: adb-phone-controller
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
